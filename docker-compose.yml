services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zrno}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zrno_dev}
      POSTGRES_DB: ${POSTGRES_DB:-zrno}
      TZ: UTC
    # 5433 da ne smeta bazi Kafeterija Portala na istoj mašini
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
